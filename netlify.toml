[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# The frontend always calls /api/ai. On Vercel that is the file api/ai.js.
# On Netlify we point the same address at the Netlify function.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true
